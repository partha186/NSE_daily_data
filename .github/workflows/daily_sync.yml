name: Daily NSE Data Sync

# ── Triggers ────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write

# ── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Sync & push EOD data ───────────────────────────────────────────
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync NSE EOD data
        run: |
          cd src
          python init.py

      - name: Commit and push EOD data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/NSE_eod_data/

          if git diff --cached --quiet; then
            echo "No data changes today — nothing to commit."
          else
            DATE=$(date '+%Y-%m-%d')
            DAY=$(date '+%A')
            git commit -m "EOD data: ${DATE} (${DAY})"
            git push
            echo "EOD data pushed successfully."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Run strategies & push results ──────────────────────────────────
  run_strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: sync_data        # waits for Job 1 to complete successfully

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy runner
        run: |
          cd src
          python strategy_runner_V2.py --folder NSE_eod_data/daily --export results.csv
        continue-on-error: true

      - name: Commit and push strategy results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/results.csv

          if git diff --cached --quiet; then
            echo "No strategy changes — nothing to commit."
          else
            DATE=$(date '+%Y-%m-%d')
            DAY=$(date '+%A')
            git commit -m "Strategy results: ${DATE} (${DAY})"
            git push
            echo "Strategy results pushed successfully."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}